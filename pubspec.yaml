name: mubeen_quran_pure
description: A focused offline Quran reader for Android and iOS.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  dart_sentencepiece_tokenizer: ^1.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  archive: ^4.2.0
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  wakelock_plus: ^1.7.0
  just_audio: ^0.9.44
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.1.21
  record: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  just_audio_platform_interface: ^4.6.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/db/quran.db.gz
    - assets/search/semantic_manifest.json
    - assets/search/bpemb_ru_10000.model
    - assets/search/bpemb_ru_10000_d100.i8
    - assets/search/ayah_embeddings.i8
    - assets/search/topic_embeddings.i8
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-PTSerif.txt
    - assets/fonts/KFGQPC_EULA.txt
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: KFGQPCHafs
      fonts:
        - asset: assets/fonts/KFGQPC_HafsUthmanic.ttf
    - family: KFGQPCHafsSmart
      fonts:
        - asset: assets/fonts/KFGQPC_HafsSmart.ttf
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSerif-Italic.ttf
          style: italic
